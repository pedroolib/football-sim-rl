[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qb-sim"
version = "0.1.0"
description = "A deterministic headless quarterback passing simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "gymnasium>=1.0"]
train = ["gymnasium>=1.0"]
rl = ["stable-baselines3>=2.4", "torch>=2.4"]
multi = ["pettingzoo>=1.24"]
viz = ["pygame-ce>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".opencode"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
